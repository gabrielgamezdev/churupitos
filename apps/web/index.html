<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget`: el teclado encoge la pantalla en vez de taparla, así lo que va
         pegado abajo (Guardar en Registrar) queda encima de él (M7). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- La barra del sistema, del color del fondo de la app en cada tema (surface). -->
    <meta name="theme-color" content="#f6f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)" />
    <title>Churupitos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
